name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: SDK e API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build da API
        run: dotnet build Backend/CentralHub.Api/CentralHub.Api.csproj -c Release
      - name: Testes do SDK
        run: dotnet test Tests/CentralHub.SDK.Tests/CentralHub.SDK.Tests.csproj -c Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
